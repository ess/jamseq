[package]
name = "jamseq"
version = "0.1.0"
edition = "2024"

[dependencies]
jamsynth = { path = "../jamsynth" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
anyhow = "1.0"
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-host", "params", "timer", "posix-fd"] }
lilv = "0.2"
lv2_raw = "0.2"
libloading = "0.8"
